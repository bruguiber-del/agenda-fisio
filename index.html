<style>
:root {
  --bg: #ffffff; --bg2: #f6f8fb; --fg: #1f2328; --muted: #5f6b7a; --line: #e3e7ee;
  --accent: #1a73e8; --accent-fg: #fff; --danger: #d93025; --ok: #188038; --warn: #b06000;
  --card: #ffffff; --hover: #eef3fd; --today: #1a73e8; --shadow: 0 4px 24px rgba(0,0,0,.12); --scrim: rgba(0,0,0,.4); --ev-fg: #ffffff;
  --h: 48px; --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --bg2: #1c2027; --fg: #e8eaed; --muted: #9aa3ae; --line: #2c323b;
    --accent: #8ab4f8; --accent-fg: #0b1a33; --danger: #f28b82; --ok: #81c995; --warn: #fdd663;
    --card: #1f242c; --hover: #263042; --today: #8ab4f8; --shadow: 0 4px 24px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --bg2: #1c2027; --fg: #e8eaed; --muted: #9aa3ae; --line: #2c323b;
  --accent: #8ab4f8; --accent-fg: #0b1a33; --danger: #f28b82; --ok: #81c995; --warn: #fdd663;
  --card: #1f242c; --hover: #263042; --today: #8ab4f8; --shadow: 0 4px 24px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

.btn { border: 1px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger-bg { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.btn.icon { padding: 6px 10px; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 14px; }
.seg button.on { background: var(--hover); color: var(--accent); font-weight: 600; }
input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
textarea { min-height: 64px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }

/* Pantalla de bloqueo */
#lock { min-height: 100%; display: grid; place-items: center; padding: 16px; background: var(--bg2); }
.lock-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.lock-card h1 { margin: 0 0 4px; font-size: 22px; }
.lock-card p { color: var(--muted); margin: 6px 0; }
.lock-card .btn { width: 100%; margin-top: 14px; padding: 10px; }
.lock-card .links { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 0; text-align: left; }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
.shield { font-size: 13px; background: var(--bg2); border-radius: 8px; padding: 10px 12px; margin-top: 14px; color: var(--muted); }

/* App */
#app { height: 100%; display: flex; flex-direction: column; }
#lock { padding-left: max(16px, env(safe-area-inset-left, 0px)) !important; padding-right: max(16px, env(safe-area-inset-right, 0px)) !important; }
.loading { color: var(--muted); text-align: center; }
header.top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; margin-right: 8px; }

.tabs button.on { background: var(--hover); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
#status { font-size: 12px; color: var(--muted); border: 0; background: none; }
#status.warn { color: var(--warn); font-weight: 600; }
main { flex: 1; min-height: 0; display: flex; }

/* Calendario */
.cal-wrap { flex: 1; display: flex; min-width: 0; }
.cal-side { width: 240px; border-right: 1px solid var(--line); padding: 14px; overflow: auto; }
.cal-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.cal-title { font-size: 20px; font-weight: 500; margin: 0 8px; }
.mini { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
.mini th { color: var(--muted); font-weight: 500; padding: 3px 0; }
.mini td button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; font-size: 12px; }
.mini td button:hover { background: var(--hover); }
.mini td button.out { color: var(--muted); opacity: .6; }
.mini td button.today { background: var(--today); color: var(--accent-fg); }
.mini td button.sel:not(.today) { background: var(--hover); color: var(--accent); font-weight: 700; }
.mini-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }

.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 4px; }
.legend div { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }

.grid { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.grid-head { display: grid; grid-template-columns: 56px repeat(var(--cols), 1fr); border-bottom: 1px solid var(--line); padding-right: var(--sbw, 0px); }
.dayhead { border: 0; background: none; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
.dayhead span { font-size: 22px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); }
.dayhead:hover span { background: var(--hover); }
.dayhead.today { color: var(--today); }
.dayhead.today span { background: var(--today); color: var(--accent-fg); }
.grid-body { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 56px repeat(var(--cols), 1fr); position: relative; }
.gutter { position: relative; }
.gutter div { height: var(--h); font-size: 10px; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-6px); }
.col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--h)); cursor: cell; }

.ev { position: absolute; left: 2px; right: 2px; border-radius: 6px; padding: 2px 6px; font-size: 12px; overflow: hidden; color: var(--ev-fg); border: 1px solid var(--bg); cursor: pointer; text-align: left; line-height: 1.25; }
.ev b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev small { opacity: .9; }
.ev.cancelada { opacity: .45; text-decoration: line-through; }
.ev.noasistio { outline: 2px dashed var(--danger); outline-offset: -2px; }
.ev.realizada::after { content: "✓"; position: absolute; right: 5px; top: 2px; font-weight: 700; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 3; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--danger); }

.month { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); border-top: 1px solid var(--line); min-height: 0; }
.month .wd { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; text-transform: uppercase; border-left: 1px solid var(--line); }
.mcell { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 4px; overflow: hidden; min-height: 80px; cursor: cell; }
.mcell.out { background: var(--bg2); }
.mcell .num { border: 0; background: none; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; display: block; margin: 0 auto 2px; }
.mcell .num:hover { background: var(--hover); }
.mcell.today .num { background: var(--today); color: var(--accent-fg); }
.chip { display: block; width: 100%; text-align: left; border: 0; border-radius: 4px; padding: 1px 6px; margin-bottom: 2px; font-size: 12px; color: var(--ev-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { border: 0; background: none; font-size: 12px; color: var(--muted); padding: 0 6px; }

/* Pacientes */
.crm { flex: 1; display: flex; min-width: 0; }
.plist { width: 320px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.plist-top { padding: 12px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
.plist-items { overflow: auto; flex: 1; }
.pitem { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 14px; }
.pitem:hover { background: var(--hover); }
.pitem.on { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.pitem small { color: var(--muted); display: block; }
.pdetail { flex: 1; overflow: auto; padding: 20px 24px; min-width: 0; }
.pd-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pd-head h2 { margin: 0; font-size: 24px; }
.pd-meta { color: var(--muted); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
.pd-meta a { color: var(--accent); text-decoration: none; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 18px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--card); }
.card h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card p { margin: 0; white-space: pre-wrap; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
.sec-h h3 { margin: 0; font-size: 16px; }
.timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; }
.entry { position: relative; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; background: var(--card); }
.entry::before { content: ""; position: absolute; left: -23px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.entry-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.entry-h strong { font-size: 15px; }
.eva { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg2); }
.entry dl { margin: 8px 0 0; display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; }
.entry dt { color: var(--muted); font-size: 13px; }
.entry dd { margin: 0; white-space: pre-wrap; }
.appts { width: 100%; border-collapse: collapse; }
.appts td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg2); white-space: nowrap; }
.badge.realizada { color: var(--ok); } .badge.cancelada, .badge.noasistio { color: var(--danger); }
.empty { color: var(--muted); text-align: center; padding: 40px 16px; }

/* Modal */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 20px 22px; }
dialog h3 { margin: 0 0 6px; font-size: 18px; }
.mfoot { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--fg); font-size: 14px; }
.check input { width: auto; }
.typepick { display: flex; gap: 6px; flex-wrap: wrap; }
.typepick label { margin: 0; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--fg); font-size: 13px; cursor: pointer; }
.typepick input { width: auto; margin: 0; }
.typepick label:has(input:checked) { border-color: var(--accent); background: var(--hover); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row output { min-width: 28px; font-weight: 700; text-align: center; }

#print-area { display: none; }
@media print {
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block; color: #000; font-size: 12px; }
  #print-area h1 { font-size: 18px; } #print-area .entry { break-inside: avoid; border: 1px solid #999; padding: 8px; margin: 8px 0; }
}

@media (max-width: 900px) {
  .cal-side { display: none; }
  .plist { width: 100%; border-right: 0; }
  .crm.detail-open .plist { display: none; }
  .crm:not(.detail-open) .pdetail { display: none; }
  .brand { font-size: 16px; }
  .lbl { display: none; }
  #status { order: 10; width: 100%; text-align: left; padding: 0; }
  .tabs button { padding: 8px 10px; }
  header.top { padding: 8px 12px; }
  .cal-bar { padding: 8px 12px; }
  .pdetail { padding: 16px; }
  .entry dl { grid-template-columns: 1fr; }
}
@media (min-width: 901px) { .only-mobile { display: none !important; } }
</style>

<script>
"use strict";

/* ---------- Servidor de sincronización (Supabase). Solo recibe datos cifrados. ---------- */
const CLOUD = { url: "https://anbuapmtzupmetnxmzqz.supabase.co", key: "sb_publishable_-09Yr9aktTNh_Ej-5Jb0Gg_ugFsY0cx" };
const cloudOn = /^https?:\/\//.test(CLOUD.url) && !CLOUD.key.startsWith("__");
addEventListener("error", e => { const m = document.getElementById("boot-msg"); if (m) m.textContent = "Error al cargar: " + (e.message || "desconocido"); });

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => crypto.randomUUID();
const pad = n => String(n).padStart(2, "0");
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const tKey = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseLocal = s => { const [d, t = "00:00"] = s.split("T"); const [y, m, dd] = d.split("-").map(Number); const [h, mi] = t.split(":").map(Number); return new Date(y, m - 1, dd, h, mi); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const sameDay = (a, b) => dKey(a) === dKey(b);
const fmt = (d, o) => new Intl.DateTimeFormat("es-ES", o).format(d);
const fmtDate = d => fmt(d, { day: "numeric", month: "short", year: "numeric" });
const fmtLong = d => fmt(d, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const WD = ["L", "M", "X", "J", "V", "S", "D"];
const fullName = p => p ? `${p.nombre} ${p.apellidos || ""}`.trim() : "";
const age = s => { if (!s) return null; const b = parseLocal(s), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const STATUS = { programada: "Programada", realizada: "Realizada", noasistio: "No asistió", cancelada: "Cancelada" };

function ask(msg, yes = "Eliminar", single = false) {
  const d = $("#ask");
  $("#ask-msg").textContent = msg; $("#ask-yes").textContent = yes;
  $("#ask-yes").className = "btn " + (single || yes !== "Eliminar" ? "primary" : "primary danger-bg");
  $("#ask-no").hidden = single;
  d.returnValue = "";
  d.showModal();
  return new Promise(res => d.addEventListener("close", () => res(d.returnValue === "yes"), { once: true }));
}
const notify = msg => ask(msg, "Entendido", true);
document.addEventListener("click", e => { const b = e.target.closest("#ask [data-v]"); if (b) $("#ask").close(b.dataset.v); });

/* ---------- Cifrado ---------- */
// De la contraseña salen tres cosas independientes: el identificador de la agenda en el servidor,
// un permiso de escritura y la clave de cifrado (AES-GCM 256). Ni la contraseña ni la clave salen del dispositivo.
const FORMAT = "agenda-fisio-cifrada";
const ITER = 600000;
const APP_SALT = new TextEncoder().encode("agenda-fisio/2026/v2");
const enc = s => new TextEncoder().encode(s);
function toB64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
async function deriveAll(pw) {
  const base = await crypto.subtle.importKey("raw", enc(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: APP_SALT, iterations: ITER, hash: "SHA-256" }, base, 256);
  const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveBits", "deriveKey"]);
  const info = s => ({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(32), info: enc(s) });
  return {
    id: hex(await crypto.subtle.deriveBits(info("vault-id"), hk, 256)),
    token: hex(await crypto.subtle.deriveBits(info("write-token"), hk, 256)),
    key: await crypto.subtle.deriveKey(info("encryption-key"), hk, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]),
  };
}
// Se comprime antes de cifrar (el cifrado no se puede comprimir después).
const gz = "CompressionStream" in window;
async function pack(str) {
  const bytes = enc(str);
  if (!gz) return { bytes, z: null };
  return { bytes: new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()), z: "gzip" };
}
async function unpack(buf, z) {
  if (!z) return new TextDecoder().decode(buf);
  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
async function seal(data, k) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const { bytes, z } = await pack(JSON.stringify(data));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc(k.id) }, k.key, bytes);
  return JSON.stringify({ format: FORMAT, v: 2, z, iv: toB64(iv), ct: toB64(new Uint8Array(ct)) });
}
function parseVault(text) {
  let f;
  try { f = JSON.parse(text); } catch { throw new Error("El archivo no es una agenda cifrada válida."); }
  if (f?.format !== FORMAT) throw new Error("El archivo no es una agenda cifrada válida.");
  return f;
}
async function openVault(text, k) {
  const f = typeof text === "string" ? parseVault(text) : text;
  let pt;

/* ---------- Copia local cifrada (para abrir sin conexión) ---------- */
const idb = (() => {
  let p;
  const db = () => p ??= new Promise((res, rej) => { const r = indexedDB.open("agenda-fisio", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("kv", mode); const req = fn(t.objectStore("kv")); t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error); }); };

  const safe = p => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))]);
  const wrap = fn => (...a) => { try { return safe(fn(...a)); } catch (e) { return Promise.reject(e); } };
  return { get: wrap(k => tx("readonly", s => s.get(k))), set: wrap((k, v) => tx("readwrite", s => s.put(v, k))), del: wrap(k => tx("readwrite", s => s.delete(k))) };
})();

const clone = o => JSON.parse(JSON.stringify(o));

// Fusión a tres bandas por registro: si el móvil y el ordenador cambian cosas distintas, se conservan ambas.
function merge(base, local, remote) {
  const out = { ...remote };
  for (const k of ["patients", "appointments", "sessions"]) {
    const B = new Map((base?.[k] || []).map(x => [x.id, x])), L = new Map(local[k].map(x => [x.id, x])), R = new Map(remote[k].map(x => [x.id, x]));
    const res = [];
    for (const id of new Set([...L.keys(), ...R.keys()])) {
      const b = B.get(id), l = L.get(id), r = R.get(id);
      const v = same(l, r) ? l : same(l, b) ? r : same(r, b) ? l : (l ?? r);
      if (v) res.push(v);
    }
    out[k] = res;
  }
  out.settings = same(local.settings, base?.settings) ? remote.settings : local.settings;
  out.updatedAt = new Date().toISOString();
  return out;
}
let saveTimer, retryTimer, chain = Promise.resolve(), pendingRender = false;

}

  try { await idb.set("vault:" + s.keys.id, { text: await seal(s.data, s.keys), base: await seal(s.base, s.keys), version: s.version }); } catch { }
}
const err = code => Object.assign(new Error(code), { code });
async function pullMerge(s) {

  const remoteData = await openVault(r.data, s.keys);
  s.data = merge(s.base, s.data, remoteData); s.base = remoteData; s.version = r.version;

}
async function doSync(checkRemote) {

  try {
    if (checkRemote && s.version > 0) {
      const v = await cloud.version(s.keys.id);
      if (v == null) throw err("missing");
      if (v !== s.version) await pullMerge(s);
    }
    for (let i = 0; s.version === 0 || !same(s.data, s.base); i++) {
      if (i > 5) throw err("server");

      try { s.version = await cloud.put(s.keys, await seal(snap, s.keys), s.version); s.base = snap; }

    if (e.code === "missing") { if (S === s) lockNow("La contraseña de esta agenda se cambió en otro dispositivo. Entra con la nueva."); return; }
    s.syncError = e.code === "offline" ? "Sin conexión." : "No se pudo sincronizar.";

  }

}

}

async function changePassword(pw) {
  await flush();
  const old = S.keys, keys = await deriveAll(pw), snap = clone(S.data);
  if (keys.id === old.id) throw new Error("Es la misma contraseña que ya tienes.");
  let version = 0;
  if (cloudOn) {
    try {
      if (await cloud.get(keys.id)) throw new Error("Esa contraseña ya se usa en otra agenda. Elige otra.");
      version = await cloud.put(keys, await seal(snap, keys), 0);
      await cloud.del(old);
    } catch (e) { if (e.code === "offline") throw new Error("Necesitas conexión a internet para cambiar la contraseña."); throw e; }
  }
  await idb.del("vault:" + old.id).catch(() => { });
  Object.assign(S, { keys, base: snap, version });
  await saveLocal(S);
  setStatus();
}

    (async () => {
      const f = parseVault(await fd.file.text());
      const data = f.v === 1 ? await openV1(f, fd.pw) : await openVault(f, await deriveAll(fd.pw));
      if (!await ask(`La copia tiene ${data.patients.length} pacientes y ${data.appointments.length} citas. ¿Sustituir la agenda actual?`, "Restaurar")) return;
      S.data = { ...data, updatedAt: new Date().toISOString() };
      commit();
      notify("Copia restaurada.");
    })().catch(e => notify(e.message));
  });
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || !S) return;
  const act = el.dataset.action, st = S.data.settings;
  switch (act) {
    case "tab": ui.tab = el.dataset.tab; render(); break;
    case "lock": lockNow(); break;
    case "settings": openSettings(); break;
    case "status": if (S.syncError) flush(); else openSettings(); break;
    case "view": ui.view = el.dataset.view; render(); break;
    case "today": ui.cursor = new Date(); ui.mini = null; render(); break;
    case "prev": case "next": {
      const k = act === "prev" ? -1 : 1, c = ui.cursor;
      ui.cursor = ui.view === "month" ? new Date(c.getFullYear(), c.getMonth() + k, 1) : addDays(c, k * (ui.view === "week" ? 7 : 1));
      ui.mini = null; render(); break;
    }
    case "mini-prev": case "mini-next": { const c = ui.mini || ui.cursor; ui.mini = new Date(c.getFullYear(), c.getMonth() + (act === "mini-prev" ? -1 : 1), 1); render(); break; }
    case "mini-day": ui.cursor = parseLocal(el.dataset.date); if (ui.view === "month") ui.view = "week"; render(); break;
    case "goto-day": ui.cursor = parseLocal(el.dataset.date); ui.view = "day"; ui.mini = null; render(); break;
    case "month-cell": openAppt({ start: `${el.dataset.date}T${pad(Math.max(st.dayStart, 9))}:00` }); break;
    case "slot": {
      const r = el.getBoundingClientRect(), H = r.height / (st.dayEnd - st.dayStart);
      let m = st.dayStart * 60 + Math.floor((e.clientY - r.top) / H * 60 / 15) * 15;
      m = Math.min(m, st.dayEnd * 60 - 15);
      openAppt({ start: `${el.dataset.date}T${pad(Math.floor(m / 60))}:${pad(m % 60)}` });
      break;
    }
    case "new-appt": {
      const now = new Date(), base = sameDay(ui.cursor, now) || ui.tab === "crm" ? now : ui.cursor;
      const h = sameDay(base, now) ? Math.min(Math.max(now.getHours() + 1, st.dayStart), st.dayEnd - 1) : Math.max(st.dayStart, 9);
      openAppt({ start: `${dKey(base)}T${pad(h)}:00`, patientId: el.dataset.patient || null });
      break;
    }
    case "edit-appt": e.stopPropagation(); openAppt(S.data.appointments.find(a => a.id === el.dataset.id)); break;
    case "new-patient": openPatient(null); break;
    case "pick-patient": ui.patientId = el.dataset.id; render(); break;
    case "back-list": ui.patientId = null; render(); break;
    case "edit-patient": openPatient(patient(el.dataset.id)); break;
    case "new-session": openSession({ patientId: el.dataset.id }); break;
    case "edit-session": openSession(S.data.sessions.find(s => s.id === el.dataset.id)); break;
    case "print-patient": printPatient(patient(el.dataset.id)); break;
    case "delete-patient": {
      const p = patient(el.dataset.id);
      ask(`¿Eliminar a ${fullName(p)} con todo su historial y sus citas? Esta acción no se puede deshacer.`).then(ok => { if (!ok || !S) return;
      S.data.patients = S.data.patients.filter(x => x.id !== p.id);
      S.data.sessions = S.data.sessions.filter(x => x.patientId !== p.id);
      S.data.appointments = S.data.appointments.filter(x => x.patientId !== p.id);
      ui.patientId = null; commit(); }); break;
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "psearch") { ui.search = e.target.value; $("#plist-items").innerHTML = renderPList(); }
});
// Refresca la línea de "ahora" cada minuto.
setInterval(() => { if (S && ui.tab === "cal" && !modal.open) render(); }, 60000);

showLock();
</script>
